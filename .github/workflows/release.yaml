name: Release
on:
  push:
    branches: [main]

# release-please keeps a release PR open with the next version and changelog.
# Merging it creates the tag and the GitHub release, and the publish job below
# ships it to npm. Publishing lives in this same workflow because a tag created
# with GITHUB_TOKEN does not trigger other workflows, and because the npm
# trusted publisher is bound to this file name.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No registry-url: it writes an .npmrc with ${NODE_AUTH_TOKEN}, which yarn 1
          # refuses to load when the variable is unset. Trusted publishing needs no token.
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Tag must match package.json version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "${TAG#v}" = "$(node -p 'require("./package.json").version')"
      - run: yarn tsc
      - run: yarn lint
      - run: yarn test
        env:
          CI: true
      - run: yarn build
      - run: npm publish --provenance --access public
