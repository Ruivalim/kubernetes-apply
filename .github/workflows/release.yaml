name: Release
on:
  push:
    tags:
      - v*

# Publishes through npm trusted publishing (OIDC), no token stored anywhere.
# The trusted publisher on npmjs.com points at this exact file name.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No registry-url: it writes an .npmrc with ${NODE_AUTH_TOKEN}, which yarn 1
          # refuses to load when the variable is unset. Trusted publishing needs no token.
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Tag must match package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: yarn tsc
      - run: yarn lint
      - run: yarn test
        env:
          CI: true
      - run: yarn build
      - run: npm publish --provenance --access public
